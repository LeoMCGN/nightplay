name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 8 */5 * *'  # Toutes les 5 jours à 8h UTC
  workflow_dispatch:        # Lancement manuel possible

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://frujwgsvevjazcbszrpf.supabase.co/auth/v1/health")
          echo "Status: $response"
          if [ "$response" != "200" ]; then
            echo "Erreur : code HTTP $response"
            exit 1
          fi
          echo "Supabase est bien actif."
