name: Supabase Keep Alive

# Filet de sécurité : le ping principal est fait par un service externe
# (cron-job.org) car le cron GitHub Actions est régulièrement retardé/sauté
# et s'auto-désactive après ~60 jours sans commit sur le repo.
on:
  schedule:
    - cron: '0 8 * * *'   # tous les jours à 8h UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase DB
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://frujwgsvevjazcbszrpf.supabase.co/rest/v1/bac_rooms?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Status: $response"
          if [ "$response" = "000" ]; then
            echo "Erreur : impossible de joindre Supabase"
            exit 1
          fi
          echo "Supabase DB bien actif (code $response)."
